server {
    listen 0.0.0.0:${PORT};
    server_name _;

    root /var/www/public;
    index index.php;
    charset utf-8;

    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_max_body_size 10m;


    # =====================================================
    # MIME TYPES
    # Bảo đảm CSS, JS, ảnh... được trình duyệt nhận đúng loại
    # =====================================================

    include /etc/nginx/mime.types;

    default_type application/octet-stream;


    # =====================================================
    # FILE TĨNH
    # =====================================================

    location ~* \.css$ {
        try_files $uri =404;

        types {
            text/css css;
        }

        access_log off;
        expires 1h;
    }


    location ~* \.js$ {
        try_files $uri =404;

        types {
            application/javascript js;
        }

        access_log off;
        expires 1h;
    }


    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
        try_files $uri =404;

        access_log off;
        expires 7d;
    }


    # =====================================================
    # LARAVEL
    # =====================================================

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }


    # Chỉ cho Laravel front controller chạy PHP

    location = /index.php {

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/index.php;

        fastcgi_param HTTP_PROXY "";

        fastcgi_pass 127.0.0.1:9000;

        fastcgi_hide_header X-Powered-By;
    }


    # Không cho chạy các file PHP khác

    location ~ \.php$ {
        return 404;
    }


    # Chặn file ẩn

    location ~ /\.(?!well-known).* {
        deny all;
    }
}